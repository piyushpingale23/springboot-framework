#################################################################################################################
# MYSQL DATABASE CONFIGURATION
#################################################################################################################

# Scenario 1:
# Spring Boot application and MySQL database are both running on the host machine.
spring.datasource.url=jdbc:mysql://localhost:3306/lms?createDatabaseIfNotExist=true

# Scenario 2:
# Spring Boot application is running inside a Docker container,
# while MySQL is running on the host machine.
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/lms?createDatabaseIfNotExist=true

# Scenario 3:
# Spring Boot application and MySQL database are running in separate
# Docker containers connected to the same Docker network.
#spring.datasource.url=jdbc:mysql://lms-mysql-db:3306/lms?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# NOTE:
# 'default_schema' is mainly used with PostgreSQL and Oracle.
# MySQL generally uses the database itself instead of schemas.
# You can remove this property unless you specifically require it.
#spring.jpa.properties.hibernate.default_schema=lms

#################################################################################################################
# JPA / HIBERNATE CONFIGURATION
#################################################################################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#################################################################################################################
# FEATURE FLAGS
#################################################################################################################

feature.logging.enabled=false

#################################################################################################################
# APPLICATION PROPERTIES
#################################################################################################################

car.carType=CarType
car.carName=CarName

engine.engineType=EngineType
engine.engineName=EngineName

petrol.engineType=PetrolEngineType
petrol.engineName=PetrolEngineName

diesel.engineType=DieselEngineType
diesel.engineName=DieselEngineName

#################################################################################################################
# SPRING PROFILES
#################################################################################################################

#spring.profiles.active=petrolEngine
spring.profiles.active=dev

#################################################################################################################
# SPRING BOOT ACTUATOR
#################################################################################################################

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#################################################################################################################
# REDIS
#################################################################################################################

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=60s

#################################################################################################################
# GRAPHQL
#################################################################################################################

spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql
logging.level.org.springframework.graphql=TRACE

#################################################################################################################
# KAFKA
#################################################################################################################

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
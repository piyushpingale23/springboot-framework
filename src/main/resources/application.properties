#################################################################################################################
# SERVER CONFIGURATION
#################################################################################################################

server.port=8090

#################################################################################################################
# APPLICATION INFORMATION
#################################################################################################################

app.name=Spring Boot
app.version=1.0
app.owner=piyushingale23

#################################################################################################################

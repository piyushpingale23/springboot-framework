spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# SCHEMA CONFIGURATION
spring.jpa.properties.hibernate.default_schema=lms

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

feature.logging.enabled=false

car.carType=CarType
car.carName=CarName
engine.engineType=EngineType
engine.engineName=EngineName

petrol.engineType=PetrolEngineType
petrol.engineName=PetrolEngineName
diesel.engineType=DieselEngineType
diesel.engineName=DieselEngineName

#spring.profiles.active=petrolEngine
spring.profiles.active=dev

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
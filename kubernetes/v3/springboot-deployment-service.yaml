apiVersion: apps/v1
kind: Deployment

metadata:
  name: lms-api
  namespace: lms

spec:
  replicas: 2

  selector:
    matchLabels:
      app: lms-api

  template:
    metadata:
      labels:
        app: lms-api

    spec:
      containers:
        - name: springboot

          image: piyushpingale23/lms-springboot-api:3.0

          ports:
            - containerPort: 8090

          envFrom:
            - configMapRef:
                name: lms-config

            - secretRef:
                name: lms-secret

---

apiVersion: v1
kind: Service

metadata:
  name: lms-api-service
  namespace: lms

spec:
  selector:
    app: lms-api

  ports:
    - port: 8090
      targetPort: 8090

  type: NodePort
apiVersion: apps/v1
kind: Deployment

metadata:
  name: lms-api
  namespace: lms

spec:

  replicas: 2

  selector:
    matchLabels:
      app: lms-api

  template:
    metadata:
      labels:
        app: lms-api

    spec:
      containers:
        - name: springboot

          image: piyushpingale23/lms-springboot-api:1.0

          ports:
            - containerPort: 8090